name: Retire legacy branches
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retire-legacy-branches.yml']
permissions:
  contents: write
jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the two reviewed legacy heads
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'JS'
          const targets = [
            ['feat/altioris-prototype', '552977a4599874bd5b9bd0f639564f19865f153d'],
            ['integration/altioris', '3a498f84c8d2d88af977e282ea4f45fd98a65470'],
          ];
          const headers = { Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
          for (const [branch, expected] of targets) {
            if (branch === 'main') throw new Error('Protected main');
            const url = 'https://api.github.com/repos/' + process.env.REPOSITORY + '/git/refs/heads/' + branch;
            const current = await fetch(url, { headers });
            if (current.status === 404) { console.log(branch + ': already absent'); continue; }
            if (!current.ok) throw new Error('Read failed: ' + current.status);
            if ((await current.json()).object.sha !== expected) throw new Error(branch + ': head changed; refusing deletion');
            const result = await fetch(url, { method: 'DELETE', headers });
            if (result.status !== 204) throw new Error(branch + ': deletion failed: ' + result.status);
            console.log(branch + ': deleted');
          }
          JS
